<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión - TikTok</title>
  <style>
    :root {
      --bg-1: #09090b;
      --bg-2: #18181b;
      --accent-1: #fe2c55;
      --accent-2: #25f4ee;
      --card: rgba(24, 24, 27, 0.88);
      --text: #ffffff;
      --muted: #a1a1aa;
      --border: rgba(255, 255, 255, 0.14);
    }

    body.theme-neon {
      --bg-1: #070b19;
      --bg-2: #1a0b2e;
      --card: rgba(15, 23, 42, 0.88);
    }

    body.theme-sunset {
      --bg-1: #1f0d14;
      --bg-2: #3b1424;
      --card: rgba(34, 15, 24, 0.88);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(254, 44, 85, 0.22), transparent 45%),
                  radial-gradient(circle at bottom right, rgba(37, 244, 238, 0.2), transparent 45%),
                  linear-gradient(160deg, var(--bg-1), var(--bg-2));
      transition: background 0.3s ease;
    }

    .card {
      width: 100%;
      max-width: 390px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 26px 22px;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
    }

    .themes {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 18px;
    }

    .theme-btn {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 12px;
      cursor: pointer;
    }

    .theme-btn.active {
      border-color: var(--accent-2);
      background: rgba(37, 244, 238, 0.16);
    }

    .logo {
      text-align: center;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      text-shadow: -2px 0 var(--accent-2), 2px 0 var(--accent-1);
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 20px;
    }

    .field {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: var(--accent-2);
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: var(--accent-1);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
    }

    .submit-btn:hover {
      opacity: 0.92;
    }

    .status {
      margin-top: 14px;
      font-size: 13px;
      text-align: center;
      min-height: 20px;
      color: var(--accent-2);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="themes">
      <button type="button" class="theme-btn active" data-theme="">Oscuro</button>
      <button type="button" class="theme-btn" data-theme="theme-neon">Neón</button>
      <button type="button" class="theme-btn" data-theme="theme-sunset">Atardecer</button>
    </div>

    <div class="logo">TikTok</div>
    <p class="subtitle">Inicia sesión para continuar</p>

    <form id="loginForm">
      <div class="field">
        <label for="userInput">Correo o nombre de usuario</label>
        <input id="userInput" type="text" placeholder="usuario@ejemplo.com" required />
      </div>

      <div class="field">
        <label for="passInput">Contraseña</label>
        <input id="passInput" type="password" placeholder="••••••••" required />
      </div>

      <button type="submit" class="submit-btn">Iniciar sesión</button>
    </form>

    <p class="status" id="statusMsg"></p>
  </main>

  <script>
    const buttons = document.querySelectorAll(".theme-btn");
    buttons.forEach((btn) => {
      btn.addEventListener("click", () => {
        document.body.className = btn.dataset.theme;
        buttons.forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
      });
    });

    const form = document.getElementById("loginForm");
    const statusMsg = document.getElementById("statusMsg");
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const user = document.getElementById("userInput").value.trim();
      statusMsg.textContent = `Vista previa lista para: ${user}`;
    });
  </script>
</body>
  </html>
